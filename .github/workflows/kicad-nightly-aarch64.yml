name: kicad-nightly-aarch64

# 纯 workflow 方案：仓库里只需要这一个文件。
# - PKGBUILD / wrapper / patch 每次从 AUR git 实时拉取（上游 bump 即跟新）
# - ubuntu-24.04-arm（免费原生 arm64，需 public 仓库）里跑 Arch Linux ARM 容器
# - 原版 PKGBUILD + makepkg --ignorearch，零改动
# - ccache 跨跑缓存；同 pkgver 已有 artifact 时自动跳过（AUR 没更新就不白烧）

on:
  workflow_dispatch:
    inputs:
      commit:
        description: '覆盖 AUR PKGBUILD 的 commit pin（留空 = 跟随上游）'
        required: false
        default: ''
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = 北京时间 04:30

permissions:
  contents: write  # 发布/更新 GitHub Release（作为 pacman 源）

concurrency:
  group: kicad-nightly-aarch64
  cancel-in-progress: false

env:
  AUR_URL: https://aur.archlinux.org/kicad-nightly.git
  ALARM_TARBALL: http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
  MIRROR: http://mirror.archlinuxarm.org

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Pull PKGBUILD from AUR
        run: |
          git clone --depth 1 "$AUR_URL" aur
          grep -E '^(pkgver|pkgrel|_commit|#commit)' aur/PKGBUILD || true

      - name: Skip if this pkgver was already built
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGVER=$(grep -m1 '^pkgver=' aur/PKGBUILD | cut -d= -f2 | tr -d '"')
          PKGREL=$(grep -m1 '^pkgrel=' aur/PKGBUILD | cut -d= -f2 | tr -d '"')
          ART="kicad-nightly-${PKGVER}-${PKGREL}-aarch64"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          # 已有同名 artifact（未过期）则跳过；过期后同版本会重编一次，无妨
          if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ART}" --paginate \
               -q '.artifacts | length > 0' | grep -q true; then
            echo "==> $ART 已存在，AUR 无更新，跳过"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ALARM rootfs tarball
        if: steps.prep.outputs.need == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/ArchLinuxARM-aarch64-latest.tar.gz
          key: alarm-rootfs-v1

      - name: Import ALARM rootfs image
        if: steps.prep.outputs.need == 'true'
        run: |
          mkdir -p .cache
          if [ ! -s .cache/ArchLinuxARM-aarch64-latest.tar.gz ]; then
            curl -fL --retry 3 -C - -o .cache/ArchLinuxARM-aarch64-latest.tar.gz "$ALARM_TARBALL"
          fi
          docker image inspect alarm-aarch64:rootfs >/dev/null 2>&1 || \
            docker import --platform linux/arm64 \
              .cache/ArchLinuxARM-aarch64-latest.tar.gz alarm-aarch64:rootfs

      - name: Restore ccache
        if: steps.prep.outputs.need == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-arm64-

      - name: Build (native arm64, ALARM container, original PKGBUILD + --ignorearch)
        if: steps.prep.outputs.need == 'true'
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          mkdir -p .ccache
          cat > .ci-container-step.sh <<'EOF'
          set -euo pipefail
          echo "==> $(uname -m) / $(nproc) cores"
          [ "$(uname -m)" = "aarch64" ] || { echo "ERROR: 需要 arm64 runner" >&2; exit 1; }

          echo "==> pacman: mirror + keyring populate"
          echo "Server = ${MIRROR}/\$arch/\$repo" > /etc/pacman.d/mirrorlist
          # GH Actions 的 docker 默认 seccomp 白名单拒绝 landlock(EPERM)，
          # pacman 6.1+ 沙箱在容器内不可用：DisableSandbox + 空 HookDir
          mkdir -p /tmp/nohooks
          grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          grep -q '^HookDir' /etc/pacman.conf || sed -i '/^\[options\]/a HookDir = /tmp/nohooks' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm archlinux
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel git cmake ninja boost mesa ccache lld fakeroot \
            wxwidgets-gtk3 python glew curl glm ngspice opencascade unixodbc \
            libgit2 protobuf nng poppler poppler-glib libspnav \
            webkit2gtk-4.1

          # ccache 无侵入接入（不改 PKGBUILD）：PATH 前置编译器包装器
          mkdir -p /usr/local/ccache-bin
          for c in cc gcc c++ g++; do
            printf '#!/bin/sh\nexec ccache /usr/bin/%s "$@"\n' "$c" > "/usr/local/ccache-bin/$c"
            chmod +x "/usr/local/ccache-bin/$c"
          done
          export PATH="/usr/local/ccache-bin:$PATH"

          # 双保险：打开 makepkg 官方 ccache 通道（pacman 7.1 的 buildenv/compiler.sh
          # 会把 /usr/lib/ccache/bin 前置到 PATH）
          sed -i 's/^BUILDENV=\(.*\)!ccache\(.*\)$/BUILDENV=\1ccache\2/' /etc/makepkg.conf
          grep '^BUILDENV' /etc/makepkg.conf

          # 属主对齐：AUR checkout 与容器内 builder 同为 uid 1001
          chown 1001:1001 /build /ccache
          chown -R 1001:1001 /build/aur
          id builder >/dev/null 2>&1 || useradd -m -u 1001 -s /bin/bash builder

          if [ -n "${COMMIT:-}" ]; then
            echo "==> 覆盖 commit pin -> $COMMIT"
            sed -i "s/#commit=.*/#commit=${COMMIT}/" /build/aur/PKGBUILD
          fi

          # PKGBUILD 运行时补丁（只影响本次构建，不回推 AUR）：
          # 补声明 webkit2gtk-4.1（上游漏列的 wx webview 依赖），
          # 使目标机 pacman -U 能自动补齐该运行库。幂等：上游已声明则跳过。
          if ! grep -q 'webkit2gtk-4.1' /build/aur/PKGBUILD; then
            sed -i "s/^\(depends=.*\))/\1 'webkit2gtk-4.1')/" /build/aur/PKGBUILD
            grep -q 'webkit2gtk-4.1' /build/aur/PKGBUILD \
              || echo "WARN: depends 注入未命中，上游 PKGBUILD 格式已变，请检查" >&2
          fi

          # arch 修正：上游只声明 x86_64。--ignorearch 只跳过检查，但包架构
          # 会被部分 makepkg 版本标成 any；直接改成 aarch64 一劳永逸
          sed -i "s/^arch=.*/arch=('aarch64')/" /build/aur/PKGBUILD

          # 链路自检（以 builder 身份跑）：验证 wrapper -> ccache -> /ccache 全链路可写；
          # canary 应显示 1 miss 且 /ccache 有写入，否则直接失败止损
          su builder -s /bin/bash -c \
            'export PATH="/usr/local/ccache-bin:$PATH" && \
             export CCACHE_DIR=/ccache CCACHE_MAXSIZE=3G CCACHE_COMPILERCHECK=content && \
             ccache -z >/dev/null && \
             echo "int main(){return 0;}" > /tmp/cc-canary.c && \
             cc -c /tmp/cc-canary.c -o /tmp/cc-canary.o && \
             echo "==> ccache 链路自检：" && ccache -s && du -sh /ccache && \
             ccache -z >/dev/null'

          echo "==> makepkg --ignorearch（原生 arm64，-j$(nproc)；首跑约 2.5~4h，缓存热约 30~90min）"
          # CCACHE_* 在 su 内部再显式 export 一遍，杜绝任何环境丢失的可能
          time su builder -s /bin/bash -c \
            'cd /build/aur && \
             export PATH="/usr/local/ccache-bin:$PATH" && \
             export CCACHE_DIR=/ccache CCACHE_MAXSIZE=3G CCACHE_COMPILERCHECK=content && \
             export MAKEFLAGS=-j$(nproc) CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) PKGEXT=.pkg.tar.zst && \
             makepkg -f --noconfirm --ignorearch'

          echo "==> ccache 统计（本次构建；放在 repo-add 前，失败也能看到命中率）"
          ccache -s || true
          du -sh /ccache 2>/dev/null || true
          echo "==> CMake 实际使用的编译器（应指向 /usr/local/ccache-bin）"
          grep -E '^CMAKE_C(XX)?_COMPILER' /build/aur/src/kicad-nightly/build/CMakeCache.txt 2>/dev/null \
            || echo "WARN: 未找到 CMakeCache.txt，无法确认编译器路径"

          echo "==> 生成 pacman 仓库数据库 (repo-add)"
          cd /build/aur
          rm -f kicad-nightly.db.tar.gz kicad-nightly.files.tar.gz kicad-nightly.db kicad-nightly.files
          repo-add kicad-nightly.db.tar.gz kicad-nightly-*-aarch64.pkg.tar.zst
          # pacman >= 7.1 的 repo-add 会自动创建 .db/.files -> .tar.gz 软链接，
          # 直接 cp 会报 "are the same file"；先 rm 再实体拷贝，兼容任意 pacman 版本，
          # 也保证 Release 上传的是普通文件而非软链接
          rm -f kicad-nightly.db kicad-nightly.files
          cp -f kicad-nightly.db.tar.gz kicad-nightly.db
          cp -f kicad-nightly.files.tar.gz kicad-nightly.files

          echo "==> 冒烟：kicad-cli version"
          su builder -s /bin/bash -c \
            'cd /build/aur/src/kicad-nightly && ./build/kicad/kicad-cli version' \
            || echo "WARN: 冒烟未通过（仅警告，包仍会上传）"

          echo "==> 产物: $(ls -1 /build/aur/kicad-nightly-*-aarch64.pkg.tar.* 2>/dev/null)"
          EOF
          docker run --rm \
            -e MIRROR="$MIRROR" \
            -e COMMIT="$COMMIT" \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=3G \
            -v "$GITHUB_WORKSPACE":/build \
            -v "$GITHUB_WORKSPACE/.ccache":/ccache \
            -w /build \
            alarm-aarch64:rootfs \
            bash /build/.ci-container-step.sh

      - name: Save ccache (job 失败也保存)
        # actions/cache 合并模式只在 job 成功时落盘（post-if: success()），
        # repo-add/上传一挂，几十分钟的编译缓存就被整个扔掉 —— 拆开并 always() 保存
        if: always() && steps.prep.outputs.need == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-arm64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload package artifact
        if: steps.prep.outputs.need == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact }}
          path: aur/kicad-nightly-*-aarch64.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

      - name: Publish pacman repo (GitHub Release 'repo')
        if: steps.prep.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=repo
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "kicad-nightly aarch64 pacman repo" \
              --notes "Auto-updated pacman repository (built from AUR PKGBUILD in CI)."
          fi
          # 只保留当前 db 指向的最新包，防止 Release 资产无限膨胀
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' \
                      | grep '\.pkg\.tar\.' || true); do
            gh release delete-asset "$TAG" "$a" -y
          done
          gh release upload "$TAG" --clobber \
            aur/kicad-nightly.db aur/kicad-nightly.files \
            aur/kicad-nightly-*-aarch64.pkg.tar.zst
          echo "目标机 pacman.conf 片段："
          echo "[kicad-nightly]"
          echo "Server = https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          echo "SigLevel = Never"
